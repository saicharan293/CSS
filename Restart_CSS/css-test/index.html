<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS test</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <section class="card">
            <div class="top">
                <div class="imgdiv">
                    <img src="https://images.unsplash.com/photo-1758335068076-7564a9ada09f?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D" alt="">
                </div>
                <h1 class="heading">
                    Alex Morgan
                </h1>
                <h4 class="title">Frontend Developer</h4>
                <p class="badge">Available for work</p>
                <p class="description">Passionate about creating beautiful and user-friendly digital experiences</p>
            </div>
            <hr>
            <div class="bottom">
                <div class="stats">
                    <div class="stat">
                        <h3 class="count">12</h3>
                        <p class="description">Projects</p>
                    </div>
                    
                    <div class="stat">
                        <h3 class="count">3+</h3>
                        <p class="description">Years exp.</p>
                    </div>
                    
                    <div class="stat">
                        <h3 class="count">8</h3>
                        <p class="description">Clients</p>
                    </div>
                    
                </div>

                <button class="view">
                    View Portfolio
                </button>
                <footer>
                    <div class="website">
                        alexmorgan.dev
                    </div>
                </footer>
            </div>
        </section>
    </main>
</body>
</html>
